version: "3.8"

services:
  qdrant:
    image: qdrant/qdrant:v1.7.3
    ports:
      - "6333:6333"
      - "6334:6334"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:6333/healthz"]
      interval: 5s
      timeout: 2s
      retries: 10
      start_period: 5s


volumes:
  qdrant_data:
